<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Module" />
<f:section name="Content">
	<f:asset.css identifier="backendtools" href="EXT:fp_masterquiz/Resources/Public/Css/Backend.css"/>
<h1><f:translate key="LLL:EXT:fp_masterquiz/Resources/Private/Language/locallang_mod1.xlf:list" default="Listing for" /> {pid}</h1>
<f:if condition="{quizzes -> f:count()} > 0">
<f:then>
<div class="table-responsive">
<table class="table">
	<tr>
		<th><f:translate key="tx_fpmasterquiz_domain_model_quiz.name" /></th>
		<th><f:translate key="tx_fpmasterquiz_domain_model_quiz.about" /></th>
		<th>Link 1</th>
		<th>Link 2</th>
		<th>Link 3</th>
	</tr>
	<f:for each="{quizzes}" as="quiz">
		<tr>
			<td>{quiz.name}</td>
			<td>{quiz.about}</td>
			<td><f:link.action action="detail" arguments="{quiz : quiz.uid}"><f:translate key="LLL:EXT:fp_masterquiz/Resources/Private/Language/locallang_mod1.xlf:detail-prop" /></f:link.action></td>
			<td><f:link.action controller="Participant" action="list" arguments="{quiz : quiz.uid}"><f:translate key="LLL:EXT:fp_masterquiz/Resources/Private/Language/locallang_mod1.xlf:detail-user" /></f:link.action></td>
			<td><f:link.action action="charts" arguments="{quiz : quiz.uid, be : 1}"><f:translate key="LLL:EXT:fp_masterquiz/Resources/Private/Language/locallang_mod1.xlf:detail-chart" /></f:link.action></td>
		</tr>
		<f:for each="{otherQuizzes}" as="otherQuizArray">
			<f:for each="{otherQuizArray}" as="otherQuiz">
				<f:if condition="{otherQuiz.l10n_parent} == {quiz.uid}">
					<tr>
						<td style="background-color: #a8a8a8;">- {otherQuiz.name}</td>
						<td style="background-color: #a8a8a8;">{otherQuiz.about}</td>
						<td style="background-color: #a8a8a8;"><f:link.action action="detail" arguments="{quiz : otherQuiz.uid}"><f:translate key="LLL:EXT:fp_masterquiz/Resources/Private/Language/locallang_mod1.xlf:detail-prop" /></f:link.action></td>
						<td style="background-color: #a8a8a8;">-</td>
						<td style="background-color: #a8a8a8;">-</td>
					</tr>
				</f:if>
			</f:for>
		</f:for>
	</f:for>
</table>
</div>
</f:then>
<f:else>
  <p><f:translate key="LLL:EXT:fp_masterquiz/Resources/Private/Language/locallang_mod1.xlf:nothing" default="Nothing found." /></p>
</f:else>
</f:if>
<f:if condition="{folders -> f:count()} > 0">
<h2><f:translate key="LLL:EXT:fp_masterquiz/Resources/Private/Language/locallang_mod1.xlf:folders" default="Folders with quizzes" /></h2>
<div class="table-responsive">
<table class="table">
	<tr>
		<th><f:translate key="LLL:EXT:fp_masterquiz/Resources/Private/Language/locallang_mod1.xlf:folders.folder" default="Folder" /></th>
		<th><f:translate key="LLL:EXT:fp_masterquiz/Resources/Private/Language/locallang_mod1.xlf:folders.quizzes" default="Quizzes" /></th>
	</tr>
	<f:for each="{folders}" as="folder">
		<tr>
			<td>
				<f:if condition="{folder.current}">
					<f:then><strong>{folder.title}</strong> [{folder.uid}]</f:then>
					<f:else><f:be.link route="fp_masterquiz" parameters="{id: folder.uid}">{folder.title}</f:be.link> [{folder.uid}]</f:else>
				</f:if>
			</td>
			<td>{folder.quizzes}</td>
		</tr>
	</f:for>
</table>
</div>
</f:if>
</f:section>
</html>
